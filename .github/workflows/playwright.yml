name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-push-pr-association:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.detect.outputs.has_pr }}
    steps:
    - name: Detect whether pushed commit belongs to a PR
      id: detect
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const commitSha = context.sha;
          const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner,
            repo,
            commit_sha: commitSha,
          });
          core.setOutput('has_pr', response.data.length > 0 ? 'true' : 'false');

  pr-all-browsers:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        react-major: [16, 17, 18, 19]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run all browser Playwright tests (React ${{ matrix.react-major }})
      run: npm run test:with-react -- ${{ matrix.react-major }} all-browsers
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-pr-react-${{ matrix.react-major }}-all-browsers
        path: playwright-report/
        retention-days: 30

  push-react-matrix:
    if: github.event_name == 'push' && needs.detect-push-pr-association.outputs.has_pr != 'true'
    needs: detect-push-pr-association
    strategy:
      fail-fast: false
      matrix:
        react-major: [16, 17, 18, 19]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run all browser Playwright tests (React ${{ matrix.react-major }})
      run: npm run test:with-react -- ${{ matrix.react-major }} all-browsers
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-push-react-${{ matrix.react-major }}-all-browsers
        path: playwright-report/
        retention-days: 30
