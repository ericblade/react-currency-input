name: Deploy New Version

on:
  repository_dispatch:
    types: [rollingversions_publish_approved]

permissions:
  contents: write
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - name: Install npm with trusted publishing support
      run: npm install --global npm@11
    - name: Install dependencies and build
      run: |
        node --version
        npm --version
        npm ci
        npm run build --if-present
      env:
        CI: true
    - name: Publish approved release with npm trusted publishing
      run: |
        test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
        test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
        npx --yes rollingversions@3.5.0 publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
